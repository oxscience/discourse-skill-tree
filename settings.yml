tree_definition:
  type: string
  textarea: true
  default: '{"height":510,"nodes":[{"id":"symposien","category":"ox-symposien-pro","label":"Symposien","x":335,"y":56,"r":26},{"id":"science","category":"forschung-evidenz","label":"Science","x":335,"y":165,"r":32},{"id":"tech-ki","category":"webinare","label":"Tech & KI","x":95,"y":300,"r":24},{"id":"training","category":"training","label":"Training","x":245,"y":300,"r":30},{"id":"rehab","category":"klinik","label":"Rehab","x":390,"y":300,"r":32},{"id":"neuro","category":"neurowissenschaften","label":["Neuro-","wissenschaften"],"x":540,"y":300,"r":28},{"id":"ernaehrung","category":"ernaehrung","label":"Ernährung","x":300,"y":430,"r":26},{"id":"pain-performance","category":"pain-performance","label":"Pain & Performance","x":470,"y":430,"r":42}],"links":[["symposien","science"],["science","tech-ki"],["science","training"],["science","rehab"],["science","neuro"],["training","ernaehrung"],["rehab","ernaehrung"],["training","pain-performance"],["rehab","pain-performance"],["neuro","pain-performance"]],"overlaps":[]}'
  description:
    en: "Skill tree definition as JSON. nodes: id, category (slug), label (fallback when the category is not visible), x/y/r (position and radius in a 680-wide coordinate space). links: pairs of node ids (learning path, solid). overlaps: pairs of node ids (thematic closeness, dashed). Invalid JSON falls back to the built-in default."
    de: "Skill-Tree-Definition als JSON. nodes: id, category (Slug), label (Fallback wenn die Kategorie nicht sichtbar ist), x/y/r (Position und Radius in einem 680 breiten Koordinatenraum). links: Paare von Node-IDs (Lernpfad, durchgezogen). overlaps: Paare von Node-IDs (inhaltliche Nähe, gestrichelt). Ungültiges JSON fällt auf den eingebauten Standard zurück."


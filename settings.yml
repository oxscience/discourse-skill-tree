tree_definition:
  type: string
  textarea: true
  default: '{"height":465,"nodes":[{"id":"science","category":"forschung-evidenz","label":"Science","x":230,"y":210,"r":32},{"id":"tech-ki","category":"webinare","label":"Tech & KI","x":110,"y":110,"r":24},{"id":"training","category":"training","label":"Training","x":405,"y":120,"r":30},{"id":"ernaehrung","category":"ernaehrung","label":"Ernährung","x":555,"y":110,"r":26},{"id":"rehab","category":"klinik","label":"Rehab","x":495,"y":320,"r":32},{"id":"neuro","category":"neurowissenschaften","label":["Neuro-","wissenschaften"],"x":160,"y":385,"r":28},{"id":"pain-performance","category":"pain-performance","label":"Pain & Performance","x":300,"y":335,"r":36},{"id":"symposien","category":"ox-symposien-pro","label":"Symposien","x":335,"y":215,"r":26}],"links":[["science","tech-ki"],["science","training"],["science","rehab"],["science","neuro"],["training","ernaehrung"],["rehab","pain-performance"],["neuro","pain-performance"]],"overlaps":[["training","rehab"],["ernaehrung","rehab"],["pain-performance","science"],["pain-performance","training"],["symposien","science"],["symposien","training"],["symposien","rehab"],["symposien","ernaehrung"],["symposien","neuro"],["symposien","pain-performance"],["symposien","tech-ki"]]}'
  description:
    en: "Skill tree definition as JSON. nodes: id, category (slug), label (fallback when the category is not visible), x/y/r (position and radius in a 680-wide coordinate space). links: pairs of node ids (learning path, solid). overlaps: pairs of node ids (thematic closeness, dashed). Invalid JSON falls back to the built-in default."
    de: "Skill-Tree-Definition als JSON. nodes: id, category (Slug), label (Fallback wenn die Kategorie nicht sichtbar ist), x/y/r (Position und Radius in einem 680 breiten Koordinatenraum). links: Paare von Node-IDs (Lernpfad, durchgezogen). overlaps: Paare von Node-IDs (inhaltliche Nähe, gestrichelt). Ungültiges JSON fällt auf den eingebauten Standard zurück."

pricing_url:

tree_definition:
  type: string
  textarea: true
  default: '{"height":475,"nodes":[{"id":"science","category":"forschung-evidenz","label":"Science","x":346,"y":70,"r":34},{"id":"tech-ki","category":"webinare","label":"Tech & KI","x":90,"y":220,"r":26},{"id":"training","category":"training","label":"Training","x":218,"y":220,"r":30},{"id":"rehab","category":"klinik","label":"Rehab","x":346,"y":220,"r":32},{"id":"neuro","category":"neurowissenschaften","label":["Neuro-","wissenschaften"],"x":474,"y":220,"r":30},{"id":"symposien","category":"ox-symposien-pro","label":"Symposien","x":602,"y":220,"r":26},{"id":"ernaehrung","category":"ernaehrung","label":"Ernährung","x":218,"y":375,"r":26},{"id":"pain-performance","category":"pain-performance","label":"Pain & Performance","x":410,"y":380,"r":42}],"links":[["science","tech-ki"],["science","training"],["science","rehab"],["science","neuro"],["science","symposien"],["training","ernaehrung"],["rehab","pain-performance"],["neuro","pain-performance"]],"overlaps":[]}'
  description:
    en: "Skill tree definition as JSON. nodes: id, category (slug), label (fallback when the category is not visible), x/y/r (position and radius in a 680-wide coordinate space). links: pairs of node ids (learning path, solid). overlaps: pairs of node ids (thematic closeness, dashed). Invalid JSON falls back to the built-in default."
    de: "Skill-Tree-Definition als JSON. nodes: id, category (Slug), label (Fallback wenn die Kategorie nicht sichtbar ist), x/y/r (Position und Radius in einem 680 breiten Koordinatenraum). links: Paare von Node-IDs (Lernpfad, durchgezogen). overlaps: Paare von Node-IDs (inhaltliche Nähe, gestrichelt). Ungültiges JSON fällt auf den eingebauten Standard zurück."


tree_definition:
  type: string
  textarea: true
  default: '{"height":470,"nodes":[{"id":"science","category":"forschung-evidenz","label":"Science","x":105,"y":275,"r":32},{"id":"training","category":"training","label":"Training","x":280,"y":275,"r":30},{"id":"rehab","category":"klinik","label":"Rehab","x":450,"y":275,"r":32},{"id":"tech-ki","category":"webinare","label":"Tech & KI","x":600,"y":275,"r":24},{"id":"ernaehrung","category":"ernaehrung","label":"Ernährung","x":370,"y":395,"r":26},{"id":"neuro","category":"neurowissenschaften","label":["Neuro-","wissenschaften"],"x":150,"y":95,"r":28},{"id":"pain-performance","category":"pain-performance","label":"Pain & Performance","x":335,"y":100,"r":36},{"id":"symposien","category":"ox-symposien-pro","label":"Symposien","x":270,"y":190,"r":24}],"links":[["science","training"],["training","rehab"],["rehab","tech-ki"],["training","ernaehrung"],["science","neuro"],["rehab","pain-performance"],["neuro","pain-performance"]],"overlaps":[["ernaehrung","rehab"],["pain-performance","science"],["pain-performance","training"],["symposien","science"],["symposien","training"],["symposien","rehab"],["symposien","ernaehrung"],["symposien","neuro"],["symposien","pain-performance"],["symposien","tech-ki"]]}'
  description:
    en: "Skill tree definition as JSON. nodes: id, category (slug), label (fallback when the category is not visible), x/y/r (position and radius in a 680-wide coordinate space). links: pairs of node ids (learning path, solid). overlaps: pairs of node ids (thematic closeness, dashed). Invalid JSON falls back to the built-in default."
    de: "Skill-Tree-Definition als JSON. nodes: id, category (Slug), label (Fallback wenn die Kategorie nicht sichtbar ist), x/y/r (Position und Radius in einem 680 breiten Koordinatenraum). links: Paare von Node-IDs (Lernpfad, durchgezogen). overlaps: Paare von Node-IDs (inhaltliche Nähe, gestrichelt). Ungültiges JSON fällt auf den eingebauten Standard zurück."

pricing_url:
  type: string
  default: "https://outoftheb-ox.de/pages/oxcampus#ox-pricing"
  description:
    en: "Target URL when a locked (Pro) node is clicked."
    de: "Ziel-URL beim Klick auf einen gesperrten (Pro-)Knoten."
